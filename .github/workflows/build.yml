name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip curl
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 构建 APK（CI 临时密钥，仅验证"可构建/可安装"）
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          # tag 用标签名，其它情况用 dev 版本名，避免把分支名当版本号
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev"
          fi
          keytool -genkeypair -keystore ci.keystore -storetype PKCS12 \
            -storepass android -keypass android -alias bridge \
            -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI Build" >/dev/null 2>&1
          KEYSTORE="$PWD/ci.keystore" bash build.sh --version-name "$VERSION_NAME"

      - name: 功能测试（Node 版代理）
        env:
          ALLOW_UPSTREAM_SKIP: "1" # GitHub runner 在境外，上游可能不可达：此时跳过联网用例而不是报红
        run: |
          bash tools/nodetest/run_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: index-translate-bridge-apk
          path: dist/*.apk

# 说明：正式 Release 的 APK 必须用**发布密钥**（tools/release.keystore）签名，
# 而该密钥不入库、也不放在 CI Secrets 里，所以这里不自动发 Release。
# 发布流程（在本机 Termux 执行）：
#   bash tools/make_release.sh <版本号>
#   git add -A && git commit -m "release v<版本号>" && git push
#   git tag v<版本号> && git push origin v<版本号>
#   然后在 GitHub 网页 "Draft a new release" 上传 release/v<版本号>/ 下的 3 个文件。
